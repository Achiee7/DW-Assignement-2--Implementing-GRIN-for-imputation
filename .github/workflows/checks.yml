name: Reproducibility checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e .
      - run: python -m pytest -q
      - name: Validate notebook format
        run: python -c "import nbformat; nbformat.validate(nbformat.read('notebooks/grin_aqi36_reproduction.ipynb', as_version=4))"
