[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dw-grin-reproduction"
version = "0.1.0"
description = "AQI-36 reproduction of GRIN for Data Wrangling Assignment 2"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grin_reproduction = ["upstream_manifest.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
